<!DOCTYPE html>
<html>
<head>
<title>Simple 2VCO Synth with Controllable Detune and Pitch Wobble</title>
<style>
  body { font-family: sans-serif; }
  .controls { margin-bottom: 1em; }
  input[type="range"] { width: 300px; }
  #wobbleDepthSlider,
  #wobbleSpeedSlider,
  label[for="wobbleDepthSlider"],
  label[for="wobbleSpeedSlider"] {
    display: none;
  }
</style>
</head>
<body>

  <h1>Simple 2VCO Synth</h1>

  <div class="controls">
    <label for="waveform1">VCO1 Waveform:</label><br>
    <select id="waveform1">
      <option value="sine">sine</option>
      <option value="square">square</option>
      <option value="sawtooth" selected>sawtooth</option>
      <option value="triangle">triangle</option>
    </select><br><br>

    <label for="waveform2">VCO2 Waveform:</label><br>
    <select id="waveform2">
      <option value="sine">sine</option>
      <option value="square">square</option>
      <option value="sawtooth" selected>sawtooth</option>
      <option value="triangle">triangle</option>
    </select><br><br>

    <label for="vco2Octave">VCO2 Octave:</label><br>
    <select id="vco2Octave">
      <option value="4">4'</option>
      <option value="8" selected>8'</option>
      <option value="16">16'</option>
      <option value="32">32'</option>
    </select><br><br>

    <button id="startButton">Start</button>
    <button id="stopButton">Stop</button><br><br>

    <label for="pitchSlider">Pitch:</label>
    <input type="range" id="pitchSlider" min="50" max="1000" value="440">
    <span id="pitchValue">440 Hz</span><br><br>

    <label for="detuneSlider">Detune:</label>
    <input type="range" id="detuneSlider" min="-50" max="50" value="10">
    <span id="detuneValue">10 cents</span><br><br>

    <label for="wobbleDepthSlider">Wobble Depth:</label>
    <input type="range" id="wobbleDepthSlider" min="0" max="300" value="0">
    <span id="wobbleDepthValue">0 cents</span><br><br>

    <label for="wobbleSpeedSlider">Wobble Speed:</label>
    <input type="range" id="wobbleSpeedSlider" min="0.1" max="10" step="0.1" value="0">
    <span id="wobbleSpeedValue">0.0 Hz</span>
  </div>

  <script>
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();

    let oscillator1;
    let oscillator2;
    let gainNode;
    let animationFrameId;
    let startTime = 0;
    let isPlaying = false;

    const pitchSlider = document.getElementById('pitchSlider');
    const pitchValueDisplay = document.getElementById('pitchValue');
    const detuneSlider = document.getElementById('detuneSlider');
    const detuneValueDisplay = document.getElementById('detuneValue');
    const wobbleDepthSlider = document.getElementById('wobbleDepthSlider');
    const wobbleDepthValueDisplay = document.getElementById('wobbleDepthValue');
    const wobbleSpeedSlider = document.getElementById('wobbleSpeedSlider');
    const wobbleSpeedValueDisplay = document.getElementById('wobbleSpeedValue');
    const startButton = document.getElementById('startButton');
    const stopButton = document.getElementById('stopButton');

    const waveform1Select = document.getElementById('waveform1');
    const waveform2Select = document.getElementById('waveform2');
    const vco2OctaveSelect = document.getElementById('vco2Octave');

    const animationInterval = 1 / 60; // seconds

    const attackTime = 0.1;
    const releaseTime = 0.2;

    pitchSlider.addEventListener('input', () => {
      const frequency = parseFloat(pitchSlider.value);
      pitchValueDisplay.textContent = `${frequency.toFixed(2)} Hz`;
      if (oscillator1 && oscillator2) {
        oscillator1.frequency.value = frequency;

        const ratio = {
          '4': 2,
          '8': 1,
          '16': 0.5,
          '32': 0.25
        }[vco2OctaveSelect.value] || 1;

        oscillator2.frequency.value = frequency * ratio;
      }
    });

    detuneSlider.addEventListener('input', () => {
      const detune = parseFloat(detuneSlider.value);
      detuneValueDisplay.textContent = `${detune} cents`;
      if (oscillator2) {
        oscillator2.detune.value = detune;
      }
    });

    wobbleDepthSlider.addEventListener('input', () => {
      const depth = parseFloat(wobbleDepthSlider.value);
      wobbleDepthValueDisplay.textContent = `${depth} cents`;
    });

    wobbleSpeedSlider.addEventListener('input', () => {
      const speed = parseFloat(wobbleSpeedSlider.value);
      wobbleSpeedValueDisplay.textContent = `${speed.toFixed(1)} Hz`;
    });

    startButton.addEventListener('click', () => {
      if (!isPlaying) {
        isPlaying = true;
        startTime = audioContext.currentTime;

        const waveform1 = waveform1Select.value;
        const waveform2 = waveform2Select.value;
        const octaveRatio = {
          '4': 2,
          '8': 1,
          '16': 0.5,
          '32': 0.25
        }[vco2OctaveSelect.value] || 1;

        const baseFreq = parseFloat(pitchSlider.value);

        oscillator1 = audioContext.createOscillator();
        oscillator1.type = waveform1;
        oscillator1.frequency.value = baseFreq;

        oscillator2 = audioContext.createOscillator();
        oscillator2.type = waveform2;
        oscillator2.frequency.value = baseFreq * octaveRatio;
        oscillator2.detune.value = parseFloat(detuneSlider.value);

        gainNode = audioContext.createGain();
        gainNode.gain.value = 0;

        oscillator1.connect(gainNode);
        oscillator2.connect(gainNode);
        gainNode.connect(audioContext.destination);

        oscillator1.start();
        oscillator2.start();

        gainNode.gain.linearRampToValueAtTime(1, audioContext.currentTime + attackTime);

        animatePitchWobble();
      }
    });

    stopButton.addEventListener('click', () => {
      if (isPlaying) {
        isPlaying = false;

        gainNode.gain.linearRampToValueAtTime(0, audioContext.currentTime + releaseTime);

        setTimeout(() => {
          if (oscillator1) oscillator1.stop();
          if (oscillator2) oscillator2.stop();
          oscillator1 = null;
          oscillator2 = null;
          gainNode = null;
        }, releaseTime * 1000);

        cancelAnimationFrame(animationFrameId);
      }
    });

    function animatePitchWobble() {
      if (!isPlaying) return;

      const elapsedTime = audioContext.currentTime - startTime;
      const wobbleDepth = parseFloat(wobbleDepthSlider.value);
      const wobbleSpeed = parseFloat(wobbleSpeedSlider.value);

      const detuneValue = wobbleDepth * Math.sin(2 * Math.PI * wobbleSpeed * elapsedTime);

      if (oscillator1) {
        oscillator1.detune.value = detuneValue;
      }

      animationFrameId = requestAnimationFrame(animatePitchWobble);
    }
  </script>

</body>
</html>
